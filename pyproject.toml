[project]
name = "mda-restock"
version = "0.1.0"
description = "An office restocking agent on MDA with Zinc and user-approved Link payments"
requires-python = ">=3.11,<3.15"
dependencies = [
  "managed-deepagents==0.8.1",
  "langchain>=1.4,<2",
  "langchain-core>=1.4,<2",
  "langchain-openai>=1.6,<2",
  "httpx==0.28.1",
  "pympp==0.11.0",
  "PyJWT[crypto]==2.15.1",
  "cryptography==50.0.2",
]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.uv]
package = false

[tool.ruff]
extend-exclude = [".mda", ".venv", ".local"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["I001", "E402"]
